<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#D7202F" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />

    <!-- Fonts: Be Vietnam Pro (display, Vietnamese diacritics drawn by a
         Vietnamese foundry) + Inter (body/UI). design-direction.md §3. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- seo:head -->
    <!-- Everything between these two markers is REPLACED server-side by the
         .NET SEO shell (D11): real title/description/OG/JSON-LD per URL.
         Keep the markers, keep the defaults valid on their own — when the shell
         is unavailable the edge serves this file untouched. -->
    <title>Quang Hưởng Computer - Máy tính chính hãng, dịch vụ tận tâm</title>
    <meta name="description" content="Quang Hưởng Computer - Chuyên cung cấp linh kiện máy tính, laptop, PC gaming chính hãng. Bảo hành tận nơi, xuất hoá đơn VAT." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Quang Hưởng Computer - Máy tính chính hãng, dịch vụ tận tâm" />
    <meta property="og:description" content="Linh kiện máy tính, laptop, PC gaming chính hãng tại Hải Phòng. Bảo hành tận nơi, xuất hoá đơn VAT." />
    <meta property="og:image" content="/brand/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Quang Hưởng Computer" />
    <meta property="og:locale" content="vi_VN" />
    <!-- /seo:head -->

    <!-- Snapshot styling. Must stay inline and small (D11: <= 1KB) — it has to
         paint before any stylesheet loads, and it disappears with the snapshot
         on React's first render. -->
    <style>
      .seo-shell{font-family:Inter,system-ui,sans-serif;color:#18181b;background:#f7f7f8}
      .seo-shell-header{height:64px;border-bottom:1px solid #e4e4e7;background:#fff}
      @media(min-width:1024px){.seo-shell-header{height:108px}}
      .seo-snapshot{max-width:1320px;margin:0 auto;padding:24px 16px}
      .seo-snapshot h1{font-size:24px;line-height:1.35;font-weight:700;margin:0 0 8px}
      .seo-snapshot h2{font-size:18px;line-height:1.4;font-weight:600;margin:16px 0 6px}
      .seo-snapshot p,.seo-snapshot li{font-size:15px;line-height:1.6;color:#52525b;margin:0 0 6px}
      .seo-snapshot ul{padding-left:18px}
      .seo-snapshot a{color:#c81828;text-decoration:none}
      @media(prefers-color-scheme:dark){.seo-shell{color:#fafafa;background:#0c0c0e}
      .seo-shell-header{background:#151518;border-color:#2a2a30}
      .seo-snapshot p,.seo-snapshot li{color:#a1a1aa}}
    </style>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root">
      <div class="seo-shell">
        <!-- Header-height placeholder: keeps the snapshot from jumping up when
             React mounts the real header. Heights come from the storefront
             prototype header (main bar h-16 = 64px, plus the lg-only h-9 ink
             strip + h-[72px] main bar = 108px). Whoever rebuilds the header in
             wave 3 must keep these two numbers in sync — see
             docs/design-guidelines.md §"SEO shell". -->
        <div class="seo-shell-header"></div>
        <!-- seo:body -->
        <!-- The SEO shell injects a minimal semantic snapshot of the page here
             (h1, key facts, links). React clears #root on first render, so the
             browser never shows both. Leave this comment in place. -->
        <!-- /seo:body -->
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
