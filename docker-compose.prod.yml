# Quang Huong Computer — production override (D05 / phase-64 W1-14)
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app \
#          --env-file .env.prod up -d --wait
# (scripts/stack-up.sh does exactly this, plus the migrate-before-serve sequencing and the
# shared-Postgres safety stop — see that script's header.)
#
# Adds: `restart: always`, per-service memory limits, 50MB x 5 rotated JSON logs, the backup
# sidecar, `stop_grace_period: 30s` (D05 §4). Does NOT touch `ports` for infra services or `web`
# — set POSTGRES_PORT/REDIS_PORT/RABBITMQ_PORT/RABBITMQ_MANAGEMENT_PORT unset (default already
# published; see below) and WEB_HTTP_PORT=80 / WEB_HTTPS_PORT=443 in .env.prod instead of editing
# this file. `docker compose config` for base+override must show ONLY 80/443 published for `web`
# and no ports at all for postgres/redis/rabbitmq — this file uses the `!reset`/`!override` YAML
# merge tags (Compose v2.24+) for that, not by omission, which Compose would otherwise MERGE
# (append) with the base file's `ports:` list instead of replacing it.

services:
  postgres:
    ports: !reset []
    restart: always
    deploy:
      resources:
        limits:
          memory: 1.5G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    stop_grace_period: 30s

  redis:
    ports: !reset []
    restart: always
    deploy:
      resources:
        limits:
          memory: 192M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    stop_grace_period: 30s

  rabbitmq:
    ports: !reset []
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    stop_grace_period: 30s

  migrate:
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 1.5G
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__AutoMigrate: "false"
      Database__AutoSeed: "false"

  api:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1.5G
    stop_grace_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  # Only `api` and `web` are ever pulled by `make deploy` (D05 §12: pulling infra images mid-deploy
  # risks RabbitMQ jumping a minor version underneath a durable volume). ports left untouched here
  # on purpose — see file header; set WEB_HTTP_PORT=80 / WEB_HTTPS_PORT=443 in .env.prod.
  web:
    restart: always
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Backup sidecar (D05 §6/§31, deploy/backup/*): pg_dump -Fc hourly 08–22h + nightly 02:30, tars
  # media-data alongside, age-encrypts, rclone-pushes offsite if BACKUP_S3_* is set, keeps
  # 48 hourly / 14 daily / 12 monthly locally. Same postgres major version as the `postgres`
  # service on purpose (pg_dump/pg_restore version-matched). Prod-only: a local `make up` demo
  # does not need offsite encrypted backups.
  backup:
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    image: ${BACKUP_IMAGE:-ghcr.io/quanghuongcomputer/backup}:${APP_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-quanghuong}-backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-quanghuongdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_AGE_PUBLIC_KEY: ${BACKUP_AGE_PUBLIC_KEY:-}
      BACKUP_S3_REMOTE: ${BACKUP_S3_REMOTE:-}
      BACKUP_S3_RCLONE_CONF: /run/secrets/rclone.conf
    volumes:
      - ./backups:/backups
      - media-data:/media-data:ro
      - ${BACKUP_S3_RCLONE_CONF_HOST:-./deploy/backup/rclone.conf.empty}:/run/secrets/rclone.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quanghuong-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    stop_grace_period: 30s
